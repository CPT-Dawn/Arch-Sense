[package]
name = "arch-sense"
version = "2.0.2"
edition = "2024"
description = "Terminal control center for Acer Predator & Nitro laptops on Linux: thermals, fans, battery and keyboard RGB."
license = "MIT"
repository = "https://github.com/CPT-Dawn/Arch-Sense"
homepage = "https://aur.archlinux.org/packages/arch-sense"
readme = "README.md"
keywords = ["acer", "tui", "fan-control", "rgb", "linux"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
rusb = "0.9.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
signal-hook = "0.3.18"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
